<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DissetaMI · Vedovelle e case dell'acqua di Milano</title>
  <meta name="description" content="Mappa di vedovelle e case dell'acqua di Milano: trova la più vicina, cerca un indirizzo, scopri curiosità e FAQ.">
  <meta name="theme-color" content="#f6f1ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DissetaMI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="inner">
      <header class="header">
        <a href="#" class="logo" aria-label="DissetaMI">Disseta<span>MI</span></a>
        <div class="lingua" role="group" aria-label="Lingua · Language">
          <svg class="ico" width="15" height="15" aria-hidden="true"><use href="vendor/lucide/sprite.svg#languages"/></svg>
          <button type="button" data-l="it" lang="it" aria-label="Italiano">IT</button>
          <button type="button" data-l="en" lang="en" aria-label="English">EN</button>
        </div>
      </header>

      <h1 class="hero"><span data-i18n="hero.l1">Le fontanelle di Milano,</span><br><em data-i18n="hero.l2">a portata di sorso.</em></h1>

      <form id="cerca" class="search" role="search" autocomplete="off">
        <div class="input-row">
          <svg class="ico" width="16" height="16" aria-hidden="true"><use href="vendor/lucide/sprite.svg#search"/></svg>
          <input id="cerca-input" type="search" data-i18n-ph="search.ph" data-i18n-aria="search.aria" placeholder="Cerca un indirizzo o un quartiere…" aria-controls="suggerimenti">
          <ul id="suggerimenti" class="suggerimenti" role="listbox" hidden></ul>
        </div>
        <div class="button-row">
          <button id="btn-vicina" type="button" class="pill secondary">
            <svg class="ico" width="15" height="15" aria-hidden="true"><use href="vendor/lucide/sprite.svg#navigation"/></svg>
            <span data-i18n="btn.nearest">Più vicina</span>
          </button>
          <button type="submit" class="pill primary">
            <svg class="ico" width="15" height="15" aria-hidden="true"><use href="vendor/lucide/sprite.svg#search"/></svg>
            <span data-i18n="btn.search">Cerca</span>
          </button>
        </div>
      </form>

      <div class="barra">
        <div class="filtri" role="group" data-i18n-aria="filtri.aria">
          <label class="chip chip-vedovelle"><input type="checkbox" id="f-vedovelle" checked><span class="dot"></span><span data-i18n="plurale.vedovelle">Vedovelle</span> <small id="n-vedovelle"></small></label>
          <label class="chip chip-case"><input type="checkbox" id="f-case" checked><span class="dot"></span><span data-i18n="plurale.case">Case dell'acqua</span> <small id="n-case"></small></label>
        </div>
      </div>

      <section class="mappa-card" id="mappa">
        <div id="map" role="application" data-i18n-aria="mappa.aria"></div>
        <div class="map-tools">
          <button id="btn-schermo" class="icon-btn" type="button" data-i18n-aria="btn.schermoIntero" data-i18n-title="btn.schermoIntero">
            <svg class="ico" width="18" height="18" aria-hidden="true"><use href="vendor/lucide/sprite.svg#maximize-2"/></svg>
          </button>
          <button id="btn-posizione" class="icon-btn" type="button" data-i18n-aria="btn.locate" data-i18n-title="btn.locate">
            <svg class="ico" width="18" height="18" aria-hidden="true"><use href="vendor/lucide/sprite.svg#locate-fixed"/></svg>
          </button>
        </div>
        <button id="btn-vicina-mappa" type="button" class="pill primary solo-schermo">
          <svg class="ico" width="15" height="15" aria-hidden="true"><use href="vendor/lucide/sprite.svg#navigation"/></svg>
          <span data-i18n="btn.nearest">Più vicina</span>
        </button>
        <div id="avviso" class="avviso" role="status" aria-live="polite" hidden></div>
      </section>

      <footer class="footer">
        <button type="button" id="footer-info" class="link-info">
          <svg class="ico" width="14" height="14" aria-hidden="true"><use href="vendor/lucide/sprite.svg#info"/></svg><span data-i18n="footer.info">Info e FAQ</span>
        </button>
        <p class="dati" id="footer-dati"></p>
        <p class="copy">© 2026 DissetaMI MVP by Francesca Fenaroli<br>
          Made with ❤️ &amp; <img src="icons/claudecode.png" alt="Claude Code" class="cc-logo"></p>
      </footer>
    </div>
  </div>

  <!-- Scheda del punto selezionato -->
  <div id="scheda" class="scrim" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="scheda-titolo">
      <div class="auras" aria-hidden="true"><div class="aura"></div><div class="aura"></div></div>
      <button class="close-btn" id="scheda-chiudi" type="button" data-i18n-aria="chiudi">
        <svg class="ico" width="18" height="18" aria-hidden="true"><use href="vendor/lucide/sprite.svg#x"/></svg>
      </button>
      <div class="popup-img" id="scheda-img">
        <img alt="" hidden>
        <svg class="ico segnaposto" width="44" height="44" aria-hidden="true"><use href=""/></svg>
      </div>
      <div class="popup-top">
        <div class="tags" id="scheda-tags"></div>
        <h2 class="popup-name" id="scheda-titolo"></h2>
      </div>
      <div class="popup-content">
        <div class="meta-row" id="scheda-luogo"><svg class="ico" width="14" height="14" aria-hidden="true"><use href="vendor/lucide/sprite.svg#map-pin"/></svg><span></span></div>
        <div class="meta-row" id="scheda-distanza"><svg class="ico" width="14" height="14" aria-hidden="true"><use href="vendor/lucide/sprite.svg#footprints"/></svg><span></span></div>
        <div class="actions">
          <button type="button" id="scheda-scopri" class="pill outline">
            <svg class="ico" width="15" height="15" aria-hidden="true"><use href="vendor/lucide/sprite.svg#book-open"/></svg><span data-i18n="scheda.scopri">Scopri di più</span>
          </button>
          <a id="scheda-indicazioni" class="pill primary" target="_blank" rel="noopener">
            <svg class="ico" width="16" height="16" aria-hidden="true"><use href="vendor/lucide/sprite.svg#navigation"/></svg><span data-i18n="scheda.vai">Portami qui!</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Finestra "Scopri di più e FAQ" -->
  <div id="scopri" class="scrim" hidden>
    <div class="popup popup-ampio" role="dialog" aria-modal="true" aria-labelledby="scopri-titolo">
      <div class="auras" aria-hidden="true"><div class="aura"></div><div class="aura"></div></div>
      <button class="close-btn" id="scopri-chiudi" type="button" data-i18n-aria="chiudi">
        <svg class="ico" width="18" height="18" aria-hidden="true"><use href="vendor/lucide/sprite.svg#x"/></svg>
      </button>
      <div class="popup-top">
        <h2 class="popup-name" id="scopri-titolo" data-i18n="scopri.titolo">Scopri di più</h2>
        <div class="tabs" role="tablist" id="scopri-tabs">
          <button type="button" role="tab" data-tab="vedovelle"><span class="dot dot-vedovelle"></span><span data-i18n="plurale.vedovelle">Vedovelle</span></button>
          <button type="button" role="tab" data-tab="case"><span class="dot dot-case"></span><span data-i18n="plurale.case">Case dell'acqua</span></button>
          <button type="button" role="tab" data-tab="info"><svg class="ico" width="14" height="14" aria-hidden="true"><use href="vendor/lucide/sprite.svg#info"/></svg><span data-i18n="tab.info">Info</span></button>
        </div>
      </div>
      <div class="popup-content scopri-corpo" id="scopri-corpo" role="tabpanel"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
